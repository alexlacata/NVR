<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fléau">
<meta name="mobile-web-app-capable" content="yes">
<title>Fléau - Cameras</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="topbar">
  <h1>
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="9.5" stroke="#3d8bfd" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="3.4" fill="#3d8bfd"/>
      <path d="M12 2.5V5.2M12 18.8V21.5M2.5 12H5.2M18.8 12H21.5" stroke="#3d8bfd" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span>Fléau</span>
  </h1>
  <div class="actions">
    <button class="btn secondary" id="btn-add" hidden>+ Camera</button>
    <a class="btn secondary" href="/systems.html">Mes systemes</a>
    <a class="btn secondary" href="/settings.html">Parametres</a>
    <button class="btn secondary" id="btn-logout">Deconnexion</button>
  </div>
</div>
<div class="container">
  <div class="card" style="padding:14px 16px" id="disk-card"></div>
  <div id="grid" class="grid"></div>
</div>

<div id="modal-root"></div>

<script src="/js/app.js"></script>
<script>
const grid = document.getElementById("grid");
const cards = {}; // camera id -> { cam, cardEl, badgeEl, videoWrapEl, hls }

function renderDiskCard(info) {
  const card = document.getElementById("disk-card");
  card.innerHTML = "";
  const pct = 100 - info.disk_free_percent;
  card.appendChild(el("div", { class: "disk-bar-wrap" }, [
    el("div", { class: "disk-bar", style: `width:${pct}%` }),
  ]));
  card.appendChild(el("div", { class: "disk-info" }, [
    el("span", {}, `${fmtBytes(info.disk_used_bytes)} utilises sur ${fmtBytes(info.disk_total_bytes)}`),
    el("span", {}, `${info.disk_free_percent}% libre - retention ${info.retention_days} j`),
  ]));

  // CPU/RAM/temperature - each omitted entirely when unavailable on this
  // host (e.g. no thermal zone inside a container without hardware
  // access) rather than showing a misleading placeholder.
  const sysStatChip = (label, value, unit, warnAt, errAt) => {
    if (value === null || value === undefined) return null;
    const level = errAt !== null && value >= errAt ? "err" : warnAt !== null && value >= warnAt ? "warn" : "";
    return el("span", { class: `sys-stat ${level}` }, `${label} ${value}${unit}`);
  };
  const statsRow = [
    sysStatChip("CPU", info.cpu_load_percent, "%", 80, 100),
    sysStatChip("RAM", info.memory_percent, "%", 85, 95),
    sysStatChip("Temperature", info.cpu_temperature_celsius, "°C", 70, 80),
  ].filter(Boolean);
  if (statsRow.length) {
    card.appendChild(el("div", { class: "sys-stats" }, statsRow));
  }
}

// Dashboard cards show a still snapshot, not a live stream: playing every
// camera's HLS feed at once as soon as the page loads adds up fast on a
// metered/4G connection for no real benefit (you're not watching most of
// them at any given moment). Clicking through to camera.html - the only
// place actually asking to watch - is where the real live view starts.
function attachPreview(videoWrap, cam) {
  const state = cam.status.state;
  videoWrap.innerHTML = "";
  if (state !== "running" && state !== "starting") {
    videoWrap.appendChild(el("div", { class: "offline" }, statusLabel(state)));
    return null;
  }
  const img = el("img", {
    src: `/api/cameras/${cam.id}/snapshot.jpg?t=${Date.now()}`,
    alt: `Apercu de ${cam.name}`,
    loading: "lazy",
  });
  img.addEventListener("error", () => {
    videoWrap.innerHTML = "";
    videoWrap.appendChild(el("div", { class: "offline" }, "Apercu indisponible"));
  });
  videoWrap.appendChild(el("a", {
    href: `/camera.html?id=${encodeURIComponent(cam.id)}`,
    class: "video-preview-link",
    title: "Voir le direct",
  }, [
    img,
    el("span", { class: "play-overlay" }, "▶"),
  ]));
  return img;
}

function cameraCard(cam) {
  const badge = el("span", { class: `badge ${cam.status.state}` }, [
    el("span", { class: "dot" }),
    statusLabel(cam.status.state),
  ]);
  const videoWrap = el("div", { class: "video-wrap" });
  const cardEl = el("div", { class: "card cam-card" }, [
    videoWrap,
    el("div", { class: "meta" }, [
      el("a", { href: `/camera.html?id=${encodeURIComponent(cam.id)}` }, cam.name),
      badge,
    ]),
    buildDeviceLinks(cam),
  ]);
  const entry = { cam, cardEl, badgeEl: badge, videoWrapEl: videoWrap, previewImg: null };
  entry.previewImg = attachPreview(videoWrap, cam);
  return entry;
}

// Refreshes only the still snapshot (one small JPEG per online camera),
// not a stream - keeps dashboard previews from going stale for hours
// without reintroducing continuous per-camera video traffic.
function refreshPreviewSnapshots() {
  for (const entry of Object.values(cards)) {
    if (entry.previewImg && ["running", "starting"].includes(entry.cam.status.state)) {
      entry.previewImg.src = `/api/cameras/${entry.cam.id}/snapshot.jpg?t=${Date.now()}`;
    }
  }
}

async function loadCameras() {
  const cameras = await apiJson("/api/cameras");
  const seenIds = new Set();

  if (cameras.length === 0 && Object.keys(cards).length === 0 && !grid.dataset.emptyShown) {
    grid.innerHTML = "";
    grid.appendChild(el("div", { class: "empty-state" }, [
      el("p", {}, "Aucune camera configuree."),
      hasPermission("cameras_manage") ? el("button", { class: "btn", onclick: () => openAddModal() }, "Ajouter une camera") : null,
    ]));
    grid.dataset.emptyShown = "1";
    return;
  }

  cameras.forEach((cam) => {
    seenIds.add(cam.id);
    const existing = cards[cam.id];
    if (!existing) {
      if (grid.dataset.emptyShown) { grid.innerHTML = ""; delete grid.dataset.emptyShown; }
      const entry = cameraCard(cam);
      cards[cam.id] = entry;
      grid.appendChild(entry.cardEl);
      return;
    }
    existing.cam = cam;
    if (existing.badgeEl.className !== `badge ${cam.status.state}`) {
      existing.badgeEl.className = `badge ${cam.status.state}`;
      existing.badgeEl.innerHTML = "";
      existing.badgeEl.appendChild(el("span", { class: "dot" }));
      existing.badgeEl.appendChild(document.createTextNode(statusLabel(cam.status.state)));
      existing.previewImg = attachPreview(existing.videoWrapEl, cam);
    }
  });

  for (const id of Object.keys(cards)) {
    if (!seenIds.has(id)) {
      cards[id].cardEl.remove();
      delete cards[id];
    }
  }
}

async function loadDisk() {
  try {
    const info = await apiJson("/api/system");
    renderDiskCard(info);
  } catch (e) {}
}

function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
}

const CAMERA_SOURCE_TYPE_OPTIONS = [
  ["rtsp", "RTSP (la plupart des cameras IP)"],
  ["rtmp", "RTMP (flux envoye par un boitier/encodeur)"],
  ["srt", "SRT (liaison a faible qualite reseau, ex. 4G)"],
  ["http", "HTTP / MJPEG (cameras plus anciennes)"],
  ["usb", "USB (camera branchee directement au boitier)"],
  ["test", "Test (mire, sans camera reelle)"],
];

function buildSourceTypeSelect() {
  return el("select", {}, CAMERA_SOURCE_TYPE_OPTIONS.map(([value, label]) => el("option", { value }, label)));
}

// Add-camera wizard: three short steps instead of one long form, since a
// single form with every field visible at once (even with advanced ones
// collapsed) still reads as overwhelming to someone who's never set up an
// RTSP camera before. Each step only shows what's relevant right then.
function openAddModal() {
  const root = document.getElementById("modal-root");
  const state = {
    step: 1,
    findMethod: null, // "scan" | "brand" | "manual"
    sourceType: "rtsp",
    url: "",
    liveUrl: "",
    name: "",
    record: true,
    testing: false,
    testResult: null, // { ok, resolution, detail } | null, from /api/cameras/test-connection
  };

  const stepLabelEl = el("div", { class: "hint", style: "margin:0 16px 6px" });
  const modalBody = el("div", { style: "padding:0 16px 16px" });

  function setStep(n) {
    state.step = n;
    render();
  }

  function onUrlFound(url, sourceType) {
    state.url = url;
    state.sourceType = sourceType || "rtsp";
    state.testResult = null;
    setStep(2);
  }

  function renderStep1() {
    const methodBtn = (key, label) => el("button", {
      type: "button",
      class: state.findMethod === key ? "btn" : "btn secondary",
      onclick: () => { state.findMethod = key; render(); },
    }, label);

    const container = el("div", {}, [
      el("p", { class: "hint", style: "margin-top:0" }, "Comment voulez-vous trouver l'adresse de votre camera ?"),
      el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px" }, [
        methodBtn("scan", "Rechercher sur le reseau"),
        methodBtn("brand", "Je connais la marque"),
        methodBtn("manual", "J'ai deja l'adresse complete"),
      ]),
    ]);

    if (state.findMethod === "scan") {
      container.appendChild(buildOnvifDiscoveryWidget({ onUseUrl: (url) => onUrlFound(url, "rtsp") }));
    } else if (state.findMethod === "brand") {
      container.appendChild(buildBrandUrlWidget({
        onUseUrl: (url) => onUrlFound(url, "rtsp"),
        onUseLiveUrl: (url) => { state.liveUrl = url; toast("Adresse du direct renseignee"); },
      }));
    } else if (state.findMethod === "manual") {
      const typeSelect = buildSourceTypeSelect();
      typeSelect.value = state.sourceType;
      const urlInput = el("input", {
        type: "text", value: state.url,
        placeholder: "rtsp://utilisateur:motdepasse@192.168.1.50:554/stream1",
      });
      container.appendChild(el("div", { class: "form-grid" }, [
        el("div", {}, [el("label", {}, "Type de connexion"), typeSelect]),
        el("div", {}, [el("label", {}, "Adresse de la camera"), urlInput,
          el("div", { class: "hint" }, "Une simple adresse IP (ex. 192.168.1.50 ou 192.168.1.50:554/stream1) suffit, rtsp:// est ajoute automatiquement.")]),
        el("div", { class: "actions" }, [
          el("button", { type: "button", class: "btn", onclick: () => {
            if (!urlInput.value.trim()) { toast("L'adresse est requise"); return; }
            onUrlFound(urlInput.value.trim(), typeSelect.value);
          }}, "Continuer"),
        ]),
      ]));
    }

    return container;
  }

  function renderStep2() {
    const typeSelect = buildSourceTypeSelect();
    typeSelect.value = state.sourceType;
    const urlInput = el("input", { type: "text", value: state.url });
    const resultEl = el("div", { style: "margin-top:10px" });
    const testBtn = el("button", { type: "button", class: "btn secondary" }, "Tester la connexion");

    function renderResult() {
      resultEl.innerHTML = "";
      if (state.testing) {
        resultEl.appendChild(el("div", { class: "hint" }, "Test en cours..."));
      } else if (state.testResult) {
        if (state.testResult.ok) {
          const res = state.testResult.resolution ? ` (${state.testResult.resolution})` : "";
          resultEl.appendChild(el("div", { style: "color:var(--ok)" }, `Connexion reussie${res}`));
        } else {
          resultEl.appendChild(el("div", { class: "error-msg" }, state.testResult.detail || "Echec de connexion"));
        }
      }
    }
    renderResult();

    testBtn.addEventListener("click", async () => {
      if (!urlInput.value.trim()) { toast("L'adresse est requise"); return; }
      state.testing = true; state.testResult = null; testBtn.disabled = true;
      renderResult();
      try {
        state.testResult = await apiJson("/api/cameras/test-connection", {
          method: "POST",
          body: JSON.stringify({ source_type: typeSelect.value, url: urlInput.value.trim() }),
        });
      } catch (e) {
        state.testResult = { ok: false, detail: e.message };
      }
      state.testing = false; testBtn.disabled = false;
      renderResult();
    });

    return el("div", {}, [
      el("div", {}, [el("label", {}, "Type de connexion"), typeSelect]),
      el("div", { style: "margin-top:10px" }, [el("label", {}, "Adresse de la camera"), urlInput]),
      testBtn,
      resultEl,
      el("div", { class: "hint", style: "margin-top:10px" },
        "Vous pouvez continuer meme sans test reussi, mais la camera restera hors ligne tant que l'adresse n'est pas correcte."),
      el("div", { class: "actions", style: "margin-top:14px" }, [
        el("button", { type: "button", class: "btn", onclick: () => {
          if (!urlInput.value.trim()) { toast("L'adresse est requise"); return; }
          state.url = urlInput.value.trim();
          state.sourceType = typeSelect.value;
          setStep(3);
        }}, "Continuer"),
        el("button", { type: "button", class: "btn secondary", onclick: () => setStep(1) }, "Precedent"),
      ]),
    ]);
  }

  function renderStep3() {
    const errorEl = el("div", { class: "error-msg" });
    const nameInput = el("input", { type: "text", value: state.name, required: "" });
    const recordCheckbox = el("input", { type: "checkbox" });
    recordCheckbox.checked = state.record;

    const liveUrlInput = el("input", { type: "text", value: state.liveUrl, placeholder: "(optionnel)" });
    const liveUrlDetails = el("details", {}, [
      el("summary", { style: "cursor:pointer;color:var(--accent);font-size:13px" },
        "Adresse additionnelle pour le direct, en qualite reduite (optionnel)"),
      el("div", { style: "margin-top:6px" }, [liveUrlInput]),
    ]);
    if (state.liveUrl) liveUrlDetails.setAttribute("open", "");

    return el("form", { class: "form-grid", onsubmit: async (ev) => {
      ev.preventDefault();
      errorEl.textContent = "";
      try {
        await apiJson("/api/cameras", {
          method: "POST",
          body: JSON.stringify({
            name: nameInput.value,
            source_type: state.sourceType,
            url: state.url,
            live_url: liveUrlInput.value || null,
            record: recordCheckbox.checked,
          }),
        });
        closeModal();
        await loadCameras();
        toast("Camera ajoutee");
      } catch (e) {
        errorEl.textContent = e.message;
      }
    }}, [
      el("div", {}, [el("label", {}, "Nom"), nameInput,
        el("div", { class: "hint" }, "Un nom pour la reconnaitre facilement, ex. \"Entree\" ou \"Jardin\".")]),
      el("div", { class: "checkbox-row" }, [recordCheckbox, el("label", {}, "Enregistrer en continu sur le disque")]),
      liveUrlDetails,
      el("div", { class: "hint" }, "Les reglages plus avances (zoom motorise, detection de mouvement, economie de donnees...) se configurent ensuite sur la page de la camera - vous pourrez y revenir a tout moment."),
      errorEl,
      el("div", { class: "actions" }, [
        el("button", { type: "submit", class: "btn" }, "Ajouter la camera"),
        el("button", { type: "button", class: "btn secondary", onclick: () => setStep(2) }, "Precedent"),
      ]),
    ]);
  }

  function render() {
    stepLabelEl.textContent = `Etape ${state.step} / 3`;
    modalBody.innerHTML = "";
    if (state.step === 1) modalBody.appendChild(renderStep1());
    else if (state.step === 2) modalBody.appendChild(renderStep2());
    else modalBody.appendChild(renderStep3());
  }

  root.appendChild(el("div", { class: "modal-backdrop", onclick: (e) => { if (e.target === e.currentTarget) closeModal(); } }, [
    el("div", { class: "modal" }, [
      el("div", { class: "modal-header" }, [
        el("h2", {}, "Ajouter une camera"),
        el("button", { class: "close-btn", onclick: closeModal }, "×"),
      ]),
      stepLabelEl,
      modalBody,
    ]),
  ]));

  render();
}

document.getElementById("btn-add").addEventListener("click", openAddModal);
document.getElementById("btn-logout").addEventListener("click", logout);

(async () => {
  await requireAuth();
  document.getElementById("btn-add").hidden = !hasPermission("cameras_manage");
  await loadRouterCredentialsForLinks();
  await loadDisk();
  await loadCameras();
  setInterval(loadCameras, 15000);
  setInterval(loadDisk, 30000);
  setInterval(refreshPreviewSnapshots, 30000);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annuaire NVR</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --bg-elevated: #1a1d24;
    --border: #2a2e37;
    --text: #e8eaed;
    --text-dim: #9aa0ac;
    --accent: #3d8bfd;
    --accent-2: #6fb0ff;
    --ok: #3ecf8e;
    --ok-bg: #16352a;
    --err: #f0575d;
    --err-bg: #3a1f20;
    --radius: 10px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-2); }
  .wrap { max-width: 640px; margin: 0 auto; }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .sub { color: var(--text-dim); font-size: 13px; margin: 4px 0 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, input, textarea {
    font: inherit;
    color: var(--text);
  }
  button {
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: 9px 14px;
    font-size: 14px;
    font-weight: 500;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: var(--accent); color: #0b0d11; border-color: var(--accent); }
  button.ghost { background: transparent; border-color: transparent; color: var(--text-dim); padding: 6px 8px; }
  button.ghost:hover { background: var(--bg-elevated); color: var(--text); }
  button.danger { color: var(--err); }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .name-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 16px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 3px 9px;
    border-radius: 999px; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .badge.online { background: var(--ok-bg); color: var(--ok); }
  .badge.online .dot { background: var(--ok); }
  .badge.offline { background: var(--err-bg); color: var(--err); }
  .badge.offline .dot { background: var(--err); }
  .badge.checking { background: var(--bg); color: var(--text-dim); }
  .badge.checking .dot { background: var(--text-dim); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

  .url-line { margin-top: 4px; font-size: 13px; }
  .url-line a { word-break: break-all; }
  .notes { margin-top: 6px; font-size: 13px; color: var(--text-dim); white-space: pre-wrap; }
  .card-actions { display: flex; gap: 2px; flex: none; }

  .empty, .loading { text-align: center; color: var(--text-dim); padding: 48px 16px; font-size: 14px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 10;
  }
  .modal {
    background: var(--bg-elevated);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    border: 1px solid var(--border);
  }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field-err { color: var(--err); font-size: 12px; margin-top: 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 20;
  }
  .spinner {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #login-screen {
    max-width: 320px; margin: 18vh auto 0; text-align: center;
  }
  #login-screen .card { text-align: left; }
</style>
</head>
<body>
  <div id="login-screen" hidden>
    <h1 style="margin-bottom:18px">🔒 Annuaire NVR</h1>
    <div class="card">
      <form id="login-form">
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input id="login-password" type="password" autocomplete="current-password" autofocus>
        </div>
        <div id="login-err" class="field-err" style="display:none"></div>
        <button type="submit" class="primary" style="width:100%">Se connecter</button>
      </form>
    </div>
  </div>

  <div id="app-screen" hidden>
    <div class="wrap">
      <header class="top">
        <div>
          <h1>Mes NVR</h1>
          <p class="sub">La liste de tous vos boîtiers, partagée sur tous vos appareils.</p>
        </div>
        <div class="actions">
          <button id="refreshBtn" class="ghost" title="Vérifier l'état">↻ Vérifier</button>
          <button id="addBtn" class="primary">+ Ajouter un NVR</button>
          <button id="logoutBtn" class="ghost">Déconnexion</button>
        </div>
      </header>
      <div id="content">
        <div class="loading"><div class="spinner"></div>Chargement…</div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var systems = [];
  var statusMap = {};

  var loginScreen = document.getElementById("login-screen");
  var appScreen = document.getElementById("app-screen");
  var contentEl = document.getElementById("content");

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  async function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    var res = await fetch(path, opts);
    if (res.status === 401) {
      showLogin();
      throw new Error("Session expirée");
    }
    var body = null;
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) {
      throw new Error((body && body.detail) || "Erreur (" + res.status + ")");
    }
    return body;
  }

  function showToast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function checkReachable(url) {
    return new Promise(function (resolve) {
      try {
        fetch(url, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(4000) })
          .then(function () { resolve(true); })
          .catch(function () { resolve(false); });
      } catch (e) {
        resolve(false);
      }
    });
  }

  function checkAll() {
    systems.forEach(function (s) { statusMap[s.id] = "checking"; });
    render();
    systems.forEach(function (s) {
      checkReachable(s.url).then(function (ok) {
        statusMap[s.id] = ok ? "online" : "offline";
        render();
      });
    });
  }

  function badgeHtml(id) {
    var st = statusMap[id] || "checking";
    var label = st === "online" ? "En ligne" : st === "offline" ? "Hors ligne" : "Vérification…";
    return '<span class="badge ' + st + '"><span class="dot"></span>' + label + "</span>";
  }

  function render() {
    if (systems.length === 0) {
      contentEl.innerHTML =
        '<div class="empty"><div class="big">📡</div>Aucun NVR pour l\'instant.<br>' +
        "Ajoutez l'adresse de votre premier boîtier.</div>";
      return;
    }
    contentEl.innerHTML = systems
      .map(function (s) {
        return (
          '<div class="card" data-id="' + esc(s.id) + '">' +
          '<div class="row">' +
          '<div style="min-width:0">' +
          '<div class="name-line"><span class="name">' + esc(s.name) + "</span>" + badgeHtml(s.id) + "</div>" +
          '<div class="url-line"><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.url) + "</a></div>" +
          (s.notes ? '<div class="notes">' + esc(s.notes) + "</div>" : "") +
          "</div>" +
          '<div class="card-actions">' +
          '<button class="ghost edit-btn" title="Modifier">✎</button>' +
          '<button class="ghost danger delete-btn" title="Supprimer">🗑</button>' +
          "</div></div></div>"
        );
      })
      .join("");

    contentEl.querySelectorAll(".edit-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest(".card").dataset.id;
        var sys = systems.find(function (s) { return s.id === id; });
        if (sys) openForm(sys);
      });
    });
    contentEl.querySelectorAll(".delete-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest(".card").dataset.id;
        var sys = systems.find(function (s) { return s.id === id; });
        if (sys) confirmDelete(sys);
      });
    });
  }

  function openForm(existing) {
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">' +
      "<h2>" + (existing ? "Modifier le NVR" : "Ajouter un NVR") + "</h2>" +
      '<div class="field"><label for="f-name">Nom</label>' +
      '<input id="f-name" maxlength="100" placeholder="Ex. Maison, Garage, Chalet…"></div>' +
      '<div class="field"><label for="f-url">Adresse (URL)</label>' +
      '<input id="f-url" maxlength="500" placeholder="https://mon-nvr.exemple.com ou http://100.x.x.x:8000"></div>' +
      '<div id="f-url-err" class="field-err" style="display:none"></div>' +
      '<div class="field"><label for="f-notes">Notes (optionnel)</label>' +
      '<textarea id="f-notes" rows="2" maxlength="300" placeholder="Emplacement, identifiant Tailscale…"></textarea></div>' +
      '<div class="modal-actions">' +
      '<button class="ghost" id="f-cancel">Annuler</button>' +
      '<button class="primary" id="f-save">Enregistrer</button>' +
      "</div></div>";
    document.body.appendChild(overlay);

    var nameInput = overlay.querySelector("#f-name");
    var urlInput = overlay.querySelector("#f-url");
    var notesInput = overlay.querySelector("#f-notes");
    var urlErr = overlay.querySelector("#f-url-err");
    var saveBtn = overlay.querySelector("#f-save");

    if (existing) {
      nameInput.value = existing.name || "";
      urlInput.value = existing.url || "";
      notesInput.value = existing.notes || "";
    }

    overlay.querySelector("#f-cancel").addEventListener("click", function () { overlay.remove(); });
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });

    saveBtn.addEventListener("click", async function () {
      var name = nameInput.value.trim();
      var url = urlInput.value.trim();
      var notes = notesInput.value.trim();
      urlErr.style.display = "none";

      if (!name) { nameInput.focus(); return; }
      if (!url || !/^https?:\/\//i.test(url)) {
        urlErr.textContent = "L'adresse doit commencer par http:// ou https://";
        urlErr.style.display = "block";
        urlInput.focus();
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Enregistrement…";
      try {
        if (existing) {
          await api("/api/systems/" + encodeURIComponent(existing.id), {
            method: "PATCH",
            body: JSON.stringify({ name: name, url: url, notes: notes }),
          });
        } else {
          await api("/api/systems", {
            method: "POST",
            body: JSON.stringify({ name: name, url: url, notes: notes }),
          });
        }
        overlay.remove();
        showToast(existing ? "NVR modifié." : "NVR ajouté.");
        await loadSystems();
      } catch (err) {
        saveBtn.disabled = false;
        saveBtn.textContent = "Enregistrer";
        urlErr.textContent = "Échec de l'enregistrement : " + err.message;
        urlErr.style.display = "block";
      }
    });
  }

  function confirmDelete(sys) {
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal">' +
      "<h2>Supprimer « " + esc(sys.name) + " » ?</h2>" +
      '<p style="color:var(--text-dim);font-size:13px;margin:0">Cette entrée disparaîtra de tous vos appareils.</p>' +
      '<div class="modal-actions">' +
      '<button class="ghost" id="d-cancel">Annuler</button>' +
      '<button class="primary" id="d-confirm" style="background:var(--err);border-color:var(--err);color:#fff">Supprimer</button>' +
      "</div></div>";
    document.body.appendChild(overlay);
    overlay.querySelector("#d-cancel").addEventListener("click", function () { overlay.remove(); });
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector("#d-confirm").addEventListener("click", async function () {
      try {
        await api("/api/systems/" + encodeURIComponent(sys.id), { method: "DELETE" });
        overlay.remove();
        showToast("NVR supprimé.");
        await loadSystems();
      } catch (err) {
        overlay.remove();
        showToast("Échec de la suppression : " + err.message);
      }
    });
  }

  async function loadSystems() {
    contentEl.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement…</div>';
    var prevIds = systems.map(function (s) { return s.id; });
    systems = await api("/api/systems");
    var newIds = systems.map(function (s) { return s.id; });
    var changed = prevIds.length !== newIds.length || newIds.some(function (id) { return prevIds.indexOf(id) === -1; });
    systems.forEach(function (s) { if (!(s.id in statusMap)) statusMap[s.id] = "checking"; });
    render();
    if (changed) checkAll();
  }

  function showLogin() {
    appScreen.hidden = true;
    loginScreen.hidden = false;
  }

  function showApp() {
    loginScreen.hidden = true;
    appScreen.hidden = false;
  }

  document.getElementById("addBtn").addEventListener("click", function () { openForm(null); });
  document.getElementById("refreshBtn").addEventListener("click", checkAll);
  document.getElementById("logoutBtn").addEventListener("click", async function () {
    await api("/api/logout", { method: "POST" });
    showLogin();
  });

  document.getElementById("login-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var pwdInput = document.getElementById("login-password");
    var errEl = document.getElementById("login-err");
    errEl.style.display = "none";
    try {
      await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pwdInput.value }),
      }).then(async function (res) {
        if (!res.ok) {
          var body = await res.json().catch(function () { return {}; });
          throw new Error(body.detail || "Échec de connexion");
        }
      });
      pwdInput.value = "";
      showApp();
      await loadSystems();
      setInterval(function () { if (systems.length) checkAll(); }, 30000);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = "block";
    }
  });

  (async function init() {
    var status = await fetch("/api/session").then(function (r) { return r.json(); }).catch(function () { return { authenticated: false }; });
    if (status.authenticated) {
      showApp();
      await loadSystems();
      setInterval(function () { if (systems.length) checkAll(); }, 30000);
    } else {
      showLogin();
    }
  })();
})();
</script>
</body>
</html>
